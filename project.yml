name: Intervally
options:
  bundleIdPrefix: com.josiahrininger
  deploymentTarget:
    # Costs nobody: watchOS 26 already needs an iPhone 11 or later on iOS 26.
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: BPW45ZHW4H
    # One version for every bundle: the embedded watch app and its widget must carry the same
    # CFBundleShortVersionString and CFBundleVersion as the iPhone app. Never override per target.
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
    # The root bundle ID. The App Store Connect record and the Pro In-App Purchase hang off it;
    # every other bundle ID is a dotted child of it (installd enforces the prefix).
    APP_BUNDLE_ID: com.josiahrininger.intervally

targets:
  # The iPhone app. App Store builds are archived from this target only; the archive carries
  # the watch app at IntervallyPhone.app/Watch/Intervally.app.
  IntervallyPhone:
    type: application
    platform: iOS
    sources:
      - path: Phone
      - path: Core
      # The run itself: engine, coordinator, Health session and notification backstop,
      # shared with the watch. The iPhone runs workouts on its own as well.
      - path: Run
      - path: Sources/Pro
      # WatchConnectivity sync; the watch app gets it through Sources.
      - path: Sources/Sync
      - path: Sources/Views/ProgressRing.swift
      # The run's Live Activity: started and updated here, drawn by IntervallyPhoneWidget.
      - path: LiveActivity
    dependencies:
      # "Embed Watch Content" into $(CONTENTS_FOLDER_PATH)/Watch. embed defaults to true for an
      # app dependency; spelled out so nobody turns it off.
      - target: Intervally
        embed: true
      # The Live Activity's views, in PlugIns.
      - target: IntervallyPhoneWidget
        embed: true
    info:
      path: Supporting/IntervallyPhone-Info.plist
      properties:
        CFBundleDisplayName: Intervally
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Every phase colour and its contrast was measured on black (Theme.swift).
        UIUserInterfaceStyle: Dark
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSHealthShareUsageDescription: >-
          Intervally shows your interval workouts from Health: each interval, your heart
          rate, and the active energy you burned.
        NSHealthUpdateUsageDescription: >-
          Intervally saves your interval sessions to Health as workouts, so they count
          toward your activity rings.
        # The run's countdown on the Lock Screen and in the Dynamic Island.
        NSSupportsLiveActivities: true
        # Each interval change is a tone or the voice coach, played while the phone is locked
        # during the run's HKWorkoutSession (iOS 26 runs one on iPhone). The cues are the
        # audio: the app never plays silence to stay awake.
        UIBackgroundModes:
          - audio
    entitlements:
      path: Supporting/IntervallyPhone.entitlements
      properties:
        # Workouts run here are saved to Health; History reads them back. No App Group: a
        # group container never crosses devices, and the Live Activity needs none.
        com.apple.developer.healthkit: true
        # The notification backstop, when a run has no workout session (Health declined).
        com.apple.developer.usernotifications.time-sensitive: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        # Simulator builds only: the app's entitlements plus get-task-allow. Without it the
        # iOS 26.3 simulator's storekitd refuses StoreKit testing ("not installed for
        # development"), for SKTestSession and the Run action's StoreKit configuration alike.
        # Device and archive builds keep the file above (SimulatorEntitlementsTests).
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Supporting/IntervallyPhone-Simulator.entitlements
        # iPhone only (no iPad screenshot set). iPad still runs it in compatibility mode,
        # which the app handles (WCSession.isSupported() == false).
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Pastel's Home Screen icon, set while the theme is Pastel (AppIconFollower). iPhone
        # only: watchOS has no alternate icons, and the watch keeps the dumbbell.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIcon-Pastel
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # The iPhone run's Live Activity: Lock Screen, Dynamic Island, a paired watch's Smart Stack.
  IntervallyPhoneWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: PhoneWidget
      - path: LiveActivity
      - path: Core
      # The iPhone app's own manifest: the extension reads only its own defaults too.
      - path: Phone/Resources/PrivacyInfo.xcprivacy
    info:
      path: Supporting/IntervallyPhoneWidget-Info.plist
      properties:
        CFBundleDisplayName: Intervally
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widget
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

  # The watch app. Installs and runs with or without the iPhone app.
  Intervally:
    type: application
    platform: watchOS
    sources:
      - path: Sources
      - path: Core
      - path: Run
      - path: Shared
      - path: Supporting/PrivacyInfo.xcprivacy
    dependencies:
      - target: IntervallyWidgetExtension
    info:
      path: Supporting/Intervally-Info.plist
      properties:
        CFBundleDisplayName: Intervally
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        # Replaces WKWatchOnly, which must go: installd rejects an iPhone app that embeds a
        # watch-only app, and WatchConnectivity has a watchOnlyApp error (7019).
        WKCompanionAppBundleIdentifier: $(APP_BUNDLE_ID)
        WKRunsIndependentlyOfCompanionApp: true
        # workout-processing is what actually keeps the app executing (and haptics
        # firing) with the wrist down; physical-therapy backs the extended-runtime
        # fallback used when Health access is declined.
        WKBackgroundModes:
          - workout-processing
          - physical-therapy
        # Apple's "Running workout sessions": "If your app plays audio or provides haptic
        # feedback during the workout session, you must also add the Audio background mode."
        # Every interval change taps the wrist during the session. The app plays no sound.
        UIBackgroundModes:
          - audio
        ITSAppUsesNonExemptEncryption: false
        # Registers intervally:// so the complication's widgetURL actually reaches the app.
        CFBundleURLTypes:
          - CFBundleURLName: com.josiahrininger.intervally
            CFBundleURLSchemes:
              - intervally
        NSHealthShareUsageDescription: >-
          Intervally reads your heart rate and active energy during a workout to show them
          alongside your intervals, and your interval workouts so Intervally on iPhone can
          show your history.
        NSHealthUpdateUsageDescription: >-
          Intervally saves your interval sessions to Health as workouts, so they count
          toward your activity rings.
    entitlements:
      path: Supporting/Intervally.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.usernotifications.time-sensitive: true
        # Per device: shared with the widget on the watch, never with the iPhone.
        com.apple.security.application-groups:
          - group.com.josiahrininger.intervally
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Embedded now, so it must not also install into the archive on its own (TN3110).
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Intervally

  IntervallyWidgetExtension:
    type: app-extension
    platform: watchOS
    sources:
      - path: Widget
      - path: Core
      - path: Shared
      - path: Supporting/PrivacyInfo.xcprivacy
    info:
      path: Supporting/IntervallyWidget-Info.plist
      properties:
        CFBundleDisplayName: Intervally
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Supporting/IntervallyWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.josiahrininger.intervally
    settings:
      base:
        # Must be a dotted child of the watch app's ID, not the iPhone app's (build error otherwise).
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).watchkitapp.widget
        SKIP_INSTALL: YES

  IntervallyTests:
    type: bundle.unit-test
    platform: watchOS
    sources:
      - path: Tests
      # Sync runs on both devices, so its tests run in both bundles.
      - path: SyncTests
      # Helpers both bundles share, such as the App Store listing's parser.
      - path: TestSupport
      # The StoreKit configuration is a resource of the test bundle only, where
      # SKTestSession loads it by URL. Never list it under Sources, Shared or Widget:
      # XcodeGen would copy it into the app or the widget.
      - path: StoreKit
        buildPhase: resources
      # The App Store listing is pasted into App Store Connect by hand, so MetadataTests
      # holds it to Apple's field limits and to the product the app actually sells. Test
      # bundle only, like the StoreKit file.
      - path: AppStore/Metadata.md
        buildPhase: resources
    dependencies:
      - target: Intervally
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).watchkitapp.tests
        GENERATE_INFOPLIST_FILE: YES
        # StoreKitTest's own header (SKTestTransaction.h) uses an API it deprecates, and
        # Xcode adds the platform test frameworks as non-system paths, so clang reports
        # it on every build. Header parsing only: Swift's deprecation warnings still apply.
        OTHER_SWIFT_FLAGS: $(inherited) -Xcc -Wno-deprecated-declarations

  IntervallyPhoneTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PhoneTests
      - path: SyncTests
      - path: TestSupport
      # SKTestSession loads it by URL; test bundle only, as for the watch.
      - path: StoreKit
        buildPhase: resources
    dependencies:
      - target: IntervallyPhone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        # Same StoreKitTest header warning as the watch tests.
        OTHER_SWIFT_FLAGS: $(inherited) -Xcc -Wno-deprecated-declarations

schemes:
  # Ship scheme: Product > Archive here, and only here.
  IntervallyPhone:
    build:
      targets:
        IntervallyPhone: all
    test:
      targets:
        - IntervallyPhoneTests
      gatherCoverageData: true
      # Tells the app it is the unit-test host, so its ProStore stays off (UnitTestHost).
      environmentVariables:
        INTERVALLY_UNIT_TESTS: "1"
    run:
      config: Debug
      # Local StoreKit testing for Xcode's Run action only, as on the watch.
      storeKitConfiguration: StoreKit/Intervally.storekit
    archive:
      config: Release
  # Watch development and the watch unit tests (README command unchanged). Never archived on
  # its own: a watch-only archive can't carry the purchase.
  Intervally:
    build:
      targets:
        Intervally: [running, testing, profiling, analyzing]
    test:
      targets:
        - IntervallyTests
      gatherCoverageData: true
      # Tells the app it is the unit-test host, so the real ProStore stays off and can't
      # finish the test session's transactions (AppDelegate.isUnitTestHost).
      environmentVariables:
        INTERVALLY_UNIT_TESTS: "1"
    run:
      config: Debug
      # Local StoreKit testing for Xcode's Run action only. XcodeGen ignores this key for
      # the test action, and `simctl launch` never applies it.
      storeKitConfiguration: StoreKit/Intervally.storekit
